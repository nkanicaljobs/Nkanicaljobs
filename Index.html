<style>
:root{
  --ink:#0b2a4a;
  --ink-2:#143a63;
  --blue:#2c75b9;
  --sky:#5aa6ee;
  --spark:#ffb81c;
  --paper:#f4f8fc;
  --white:#ffffff;
  --muted:#5b7089;
  --line:#dbe6f1;
  --display:"Baloo 2","Hind",system-ui,sans-serif;
  --body:"Hind",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);color:var(--ink);background:var(--paper);line-height:1.65;font-size:17px;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--spark);outline-offset:3px;border-radius:6px}
.wrap{width:min(1120px,92%);margin-inline:auto}

/* ---------- नेव ---------- */
.nav{position:sticky;top:0;z-index:50;background:rgba(11,42,74,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff;font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:.2px}
.brand img{width:38px;height:38px;border-radius:50%}
.nav-links{display:flex;gap:28px;align-items:center}
.nav-links a{color:#cfe0f2;text-decoration:none;font-weight:500;font-size:.98rem;transition:color .2s}
.nav-links a:hover{color:#fff}
.btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:1.05rem;text-decoration:none;border-radius:999px;padding:13px 26px;border:0;cursor:pointer;transition:transform .18s ease, box-shadow .18s ease, background .18s ease}
.btn-spark{background:var(--spark);color:var(--ink);box-shadow:0 8px 24px -8px rgba(255,184,28,.7)}
.btn-spark:hover{transform:translateY(-2px);box-shadow:0 14px 30px -8px rgba(255,184,28,.85)}
.btn-ghost{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.35)}
.btn-ghost:hover{border-color:#fff;background:rgba(255,255,255,.08)}
.btn svg{width:22px;height:22px;flex:none}
.nav .btn{padding:9px 20px;font-size:.95rem}

/* ---------- हीरो ---------- */
.hero{position:relative;background:var(--ink);color:#fff;overflow:hidden;padding:84px 0 120px}
.hero::before{content:"";position:absolute;inset:0;background:
  radial-gradient(900px 500px at 85% 10%,rgba(90,166,238,.35),transparent 60%),
  radial-gradient(700px 420px at 0% 100%,rgba(44,117,185,.45),transparent 60%);}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:80px;background:var(--paper);clip-path:ellipse(75% 100% at 50% 100%)}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);padding:6px 16px;border-radius:999px;font-size:.92rem;color:#d8e8f8;margin-bottom:22px}
.pill i{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 4px rgba(74,222,128,.25)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2.5rem,6vw,4.4rem);line-height:1.08;letter-spacing:-.5px}
h1 .mark{background:linear-gradient(transparent 62%,rgba(255,184,28,.85) 62%);padding:0 .1em}
.lead{margin-top:22px;font-size:1.15rem;color:#c3d6ea;max-width:34em}
.cta-row{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px}
.btn-big{padding:17px 34px;font-size:1.2rem}
.micro{margin-top:18px;font-size:.92rem;color:#93aecb}

/* फ़ोन मॉकअप */
.stage{position:relative;display:grid;place-items:center;min-height:460px}
.ring{position:absolute;width:min(420px,90%);aspect-ratio:1;border-radius:50%;border:2px dashed rgba(255,255,255,.18);animation:spin 40s linear infinite}
.ring.two{width:min(320px,70%);border-color:rgba(255,184,28,.35);animation-direction:reverse;animation-duration:30s}
@keyframes spin{to{transform:rotate(360deg)}}
.phone{position:relative;width:min(270px,70vw);aspect-ratio:9/18.5;background:#061a30;border-radius:38px;padding:11px;box-shadow:0 40px 80px -20px rgba(0,0,0,.65),inset 0 0 0 2px #1f4468;transform:rotate(-4deg)}
.screen{height:100%;border-radius:28px;background:linear-gradient(180deg,#eaf3fc,#fff 40%);color:var(--ink);padding:18px 14px;overflow:hidden;display:flex;flex-direction:column;gap:11px}
.notch{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:70px;height:18px;background:#061a30;border-radius:0 0 14px 14px;z-index:2}
.scr-head{display:flex;align-items:center;gap:8px;margin-top:10px}
.scr-head img{width:28px;height:28px;border-radius:50%}
.scr-head b{font-family:var(--display);font-size:.95rem}
.search{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.78rem;color:var(--muted)}
.job{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:2px;font-size:.78rem}
.job b{font-family:var(--display);font-size:.9rem}
.job span{color:var(--muted)}
.job em{font-style:normal;color:var(--blue);font-weight:600}
.job.live{animation:pop 6s ease-in-out infinite}
@keyframes pop{0%,70%,100%{transform:none;box-shadow:none}80%{transform:scale(1.04);box-shadow:0 12px 24px -10px rgba(44,117,185,.5)}}
.fab{margin-top:auto;align-self:flex-end;background:var(--blue);color:#fff;border-radius:999px;padding:8px 14px;font-size:.78rem;font-weight:600}

/* ---------- सेक्शन ---------- */
section{padding:92px 0}
.sec-head{max-width:640px;margin-bottom:48px}
.sec-head h2{font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,4vw,2.9rem);line-height:1.15}
.sec-head p{margin-top:12px;color:var(--muted);font-size:1.08rem}

.features{display:grid;grid-template-columns:repeat(6,1fr);gap:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-4px);border-color:var(--sky)}
.card .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--ink);color:var(--spark);margin-bottom:18px}
.card .ic svg{width:26px;height:26px}
.card h3{font-family:var(--display);font-size:1.3rem;margin-bottom:6px}
.card p{color:var(--muted);font-size:1rem}
.card.a{grid-column:span 3}
.card.b{grid-column:span 3}
.card.c,.card.d,.card.e{grid-column:span 2}
.card.big{background:var(--ink);color:#fff;border-color:var(--ink)}
.card.big p{color:#b4cbe2}
.card.big .ic{background:var(--spark);color:var(--ink)}

/* कैसे काम करता है */
.how{background:#fff;border-block:1px solid var(--line)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:0;counter-reset:s;position:relative}
.step{padding:8px 32px 8px 0;position:relative}
.step::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--blue);color:#fff;font-family:var(--display);font-weight:800;font-size:1.2rem;margin-bottom:16px}
.step:not(:last-child)::after{content:"";position:absolute;top:23px;left:58px;right:12px;border-top:2px dashed var(--line)}
.step h3{font-family:var(--display);font-size:1.3rem;margin-bottom:4px}
.step p{color:var(--muted)}

/* भरोसा पट्टी */
.trust{background:var(--ink-2);color:#fff;padding:64px 0}
.trust .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.t{display:flex;gap:16px;align-items:flex-start}
.t svg{width:34px;height:34px;color:var(--spark);flex:none;margin-top:3px}
.t b{font-family:var(--display);font-size:1.2rem;display:block}
.t span{color:#b4cbe2;font-size:.98rem}

/* अंतिम CTA */
.final{background:linear-gradient(135deg,var(--blue),var(--ink));color:#fff;text-align:center;position:relative;overflow:hidden}
.final::before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:rgba(255,184,28,.12);right:-140px;top:-200px}
.final .wrap{position:relative}
.final h2{font-family:var(--display);font-weight:800;font-size:clamp(2rem,5vw,3.3rem);line-height:1.15}
.final p{margin:14px auto 32px;max-width:36em;color:#d3e4f6;font-size:1.1rem}
.final .note{margin-top:20px;font-size:.92rem;color:#b4cbe2}

/* फ़ुटर */
footer{background:#061a30;color:#8fa9c4;padding:36px 0;font-size:.95rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center}
footer .brand{font-size:1.1rem}
footer .brand img{width:30px;height:30px}

/* मॉडल (इंस्टॉल गाइड) */
dialog{border:0;border-radius:24px;padding:0;max-width:min(460px,92vw);width:100%;box-shadow:0 40px 90px -20px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(6,26,48,.7);backdrop-filter:blur(4px)}
.dlg{padding:32px}
.dlg h3{font-family:var(--display);font-size:1.5rem;margin-bottom:6px}
.dlg ol{margin:16px 0 22px 20px;color:var(--muted)}
.dlg li{margin-bottom:8px}
.dlg .row{display:flex;gap:10px;flex-wrap:wrap}
.dlg .btn{font-size:1rem}
.btn-line{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn-line:hover{border-color:var(--blue)}

/* एंट्री एनिमेशन: सिर्फ़ हीरो पर एक बार */
.hero .wrap>div:first-child{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.phone{animation:float 7s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(-4deg) translateY(-12px)}}

@media (max-width:900px){
  .nav-links a.hide-m{display:none}
  .hero{padding:56px 0 100px}
  .hero .wrap{grid-template-columns:1fr;gap:30px}
  .stage{min-height:400px}
  .features{grid-template-columns:1fr}
  .card.a,.card.b,.card.c,.card.d,.card.e{grid-column:auto}
  .steps{grid-template-columns:1fr;gap:28px}
  .step::after{display:none}
  .trust .wrap{grid-template-columns:1fr}
  section{padding:68px 0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
</style>
